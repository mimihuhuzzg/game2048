<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Clear Sans','Helvetica Neue',Arial,sans-serif;background:#faf8ef;color:#776e65;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:10px;-webkit-tap-highlight-color:transparent;user-select:none}
.wrap{width:100%;max-width:480px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.title{font-size:54px;font-weight:bold;line-height:1}
.scores{display:flex;gap:8px}
.score-box{background:#bbada0;color:#fff;border-radius:6px;padding:6px 14px;text-align:center;min-width:78px}
.score-box .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.8}
.score-box .value{font-size:22px;font-weight:bold;line-height:1.2}
.intro{font-size:14px;line-height:1.5;margin-bottom:10px}
.intro b{color:#8f7a65}
.controls{display:flex;gap:8px;margin-bottom:10px}
.btn{background:#8f7a65;color:#fff;border:none;border-radius:6px;padding:10px 18px;font-size:14px;font-weight:bold;cursor:pointer;transition:background .15s}
.btn:hover{background:#9f8b77}
.btn:active{background:#7a6655}
.board{background:#bbada0;border-radius:8px;padding:10px;position:relative;width:100%;aspect-ratio:1/1;touch-action:none}
.grid-bg{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;width:100%;height:100%}
.cell-bg{background:rgba(238,228,218,0.35);border-radius:6px}
.tiles{position:absolute;top:10px;left:10px;right:10px;bottom:10px;pointer-events:none}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:bold;border-radius:6px;transition:left .12s ease,top .12s ease;animation:pop .15s ease}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.msg{text-align:center;font-size:20px;font-weight:bold;margin-top:12px;min-height:28px;color:#8f7a65}
.overlay{position:absolute;inset:0;background:rgba(238,228,218,0.78);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.overlay h2{font-size:40px;color:#776e65}
.overlay .btn{font-size:16px;padding:12px 24px}
.hint{font-size:12px;color:#bbada0;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box"><div class="label">分数</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">最高</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="intro">合并相同数字得到 <b>2048</b>！方向键 / WASD / 滑动操作。</div>
  <div class="controls">
    <button class="btn" id="newGame">新游戏</button>
    <button class="btn" id="undo">撤销</button>
  </div>
  <div class="board" id="board">
    <div class="grid-bg" id="gridBg"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">游戏结束</h2>
      <button class="btn" id="overlayBtn">再来一局</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="hint">PC: 方向键/WASD &nbsp;|&nbsp; 移动端: 上下左右滑动</div>
</div>
<script>
(function(){
  var SIZE=4;
  var board=[],score=0,best=+localStorage.getItem('best2048')||0;
  var gameOver=false,won=false,keepPlaying=false;
  var history=[];
  var colors={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
  var darkColors={4096:'#3c3a32',8192:'#3c3a32',16384:'#3c3a32'};
  function bg(v){return colors[v]||darkColors[v]||'#3c3a32';}
  function fg(v){return v<=4?'#776e65':'#f9f6f2';}
  function fs(v,s){var l=String(v).length;return Math.round(s*(l<=2?0.5:l===3?0.42:l===4?0.34:0.28));}
  function emptyBoard(){var b=[];for(var i=0;i<SIZE;i++){b.push([0,0,0,0]);}return b;}
  function clone(b){var n=[];for(var i=0;i<SIZE;i++){n.push(b[i].slice());}return n;}
  function init(){
    board=emptyBoard();score=0;gameOver=false;won=false;keepPlaying=false;history=[];
    addRandom();addRandom();render();
    document.getElementById('msg').textContent='';
    hideOverlay();
  }
  function addRandom(){
    var e=[];for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++)if(board[r][c]===0)e.push([r,c]);
    if(!e.length)return;
    var p=e[Math.floor(Math.random()*e.length)];
    board[p[0]][p[1]]=Math.random()<0.9?2:4;
  }
  function render(){
    var tiles=document.getElementById('tiles');
    var boardEl=document.getElementById('board');
    var pad=10,gap=10;
    var bw=boardEl.clientWidth;
    var cs=(bw-pad*2-gap*3)/4;
    tiles.innerHTML='';
    for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
      var v=board[r][c];if(v===0)continue;
      var t=document.createElement('div');
      t.className='tile';t.textContent=v;
      t.style.width=cs+'px';t.style.height=cs+'px';
      t.style.left=(c*(cs+gap))+'px';t.style.top=(r*(cs+gap))+'px';
      t.style.background=bg(v);t.style.color=fg(v);t.style.fontSize=fs(v,cs)+'px';
      tiles.appendChild(t);
    }
    document.getElementById('score').textContent=score;
    document.getElementById('best').textContent=best;
  }
  function slide(line){
    var nz=line.filter(function(x){return x!==0;});
    var gained=0,mergedAny=false;
    for(var i=0;i<nz.length-1;i++){
      if(nz[i]===nz[i+1]){nz[i]*=2;gained+=nz[i];if(nz[i]===2048)won=true;mergedAny=true;nz.splice(i+1,1);}
    }
    while(nz.length<SIZE)nz.push(0);
    return{row:nz,gained:gained};
  }
  function move(dir){
    if(gameOver)return;
    var snapshot={b:clone(board),s:score};
    var moved=false,gained=0;
    var lines=[],idx=[];
    if(dir===3){for(var r=0;r<SIZE;r++){lines.push(board[r].slice());idx.push([r,0,r,1]);}}
    else if(dir===1){for(var r=0;r<SIZE;r++){lines.push(board[r].slice().reverse());idx.push([r,3,r,-1]);}}
    else if(dir===0){for(var c=0;c<SIZE;c++){var col=[];for(var r=0;r<SIZE;r++)col.push(board[r][c]);lines.push(col);idx.push([0,c,1,c]);}}
    else if(dir===2){for(var c=0;c<SIZE;c++){var col=[];for(var r=0;r<SIZE;r++)col.push(board[r][c]);lines.push(col.reverse());idx.push([3,c,-1,c]);}}
    var results=lines.map(slide);
    for(var i=0;i<SIZE;i++){
      gained+=results[i].gained;
      var row=results[i].row;
      if(dir===3){for(var c=0;c<SIZE;c++)if(board[i][c]!==row[c]){moved=true;}for(var c=0;c<SIZE;c++)board[i][c]=row[c];}
      else if(dir===1){var rr=row.slice().reverse();for(var c=0;c<SIZE;c++)if(board[i][c]!==rr[c]){moved=true;}for(var c=0;c<SIZE;c++)board[i][c]=rr[c];}
      else if(dir===0){for(var r=0;r<SIZE;r++)if(board[r][i]!==row[r]){moved=true;}for(var r=0;r<SIZE;r++)board[r][i]=row[r];}
      else if(dir===2){var rr=row.slice().reverse();for(var r=0;r<SIZE;r++)if(board[r][i]!==rr[r]){moved=true;}for(var r=0;r<SIZE;r++)board[r][i]=rr[r];}
    }
    if(moved){
      history.push(snapshot);if(history.length>10)history.shift();
      score+=gained;if(score>best){best=score;localStorage.setItem('best2048',best);}
      addRandom();render();
      if(won&&!keepPlaying){keepPlaying=true;document.getElementById('msg').textContent='🎉 达成 2048！继续挑战更高分数';}
      if(isGameOver()){gameOver=true;showOverlay('游戏结束');}
    }
  }
  function isGameOver(){
    for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
      if(board[r][c]===0)return false;
      if(c<SIZE-1&&board[r][c]===board[r][c+1])return false;
      if(r<SIZE-1&&board[r][c]===board[r+1][c])return false;
    }
    return true;
  }
  function undo(){
    if(!history.length||gameOver)return;
    var s=history.pop();board=s.b;score=s.s;render();document.getElementById('msg').textContent='';
  }
  function showOverlay(title){var o=document.getElementById('overlay');document.getElementById('overlayTitle').textContent=title;o.classList.add('show');}
  function hideOverlay(){document.getElementById('overlay').classList.remove('show');}
  document.addEventListener('keydown',function(e){
    var m={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,W:0,d:1,D:1,s:2,S:2,a:3,A:3};
    if(e.key in m){e.preventDefault();move(m[e.key]);}
    else if(e.key==='z'||e.key==='Z'){undo();}
  });
  var ts=null;
  var boardEl=document.getElementById('board');
  boardEl.addEventListener('touchstart',function(e){ts={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
  boardEl.addEventListener('touchend',function(e){
    if(!ts)return;
    var dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;
    if(Math.abs(dx)<24&&Math.abs(dy)<24){ts=null;return;}
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:3);else move(dy>0?2:0);
    ts=null;
  },{passive:true});
  document.getElementById('newGame').addEventListener('click',init);
  document.getElementById('undo').addEventListener('click',undo);
  document.getElementById('overlayBtn').addEventListener('click',init);
  var gridBg=document.getElementById('gridBg');
  for(var i=0;i<16;i++){var cell=document.createElement('div');cell.className='cell-bg';gridBg.appendChild(cell);}
  window.addEventListener('resize',render);
  window.addEventListener('load',render);
  init();
})();
</script>
</body>
</html>
